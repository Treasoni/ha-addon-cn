name: Build & push haos-mirror-switcher prebuilt image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["haos-mirror-switcher/**"]
    tags: ["haos-mirror-switcher-*"]

concurrency:
  group: build-addon-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAMESPACE: Treasoni
  ADDON_DIR: haos-mirror-switcher

jobs:
  build:
    name: Build haos-mirror-switcher-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/aarch64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from config.yaml
        id: version
        run: |
          VERSION="$(sed -n -E 's/^version:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/p' "${{ env.ADDON_DIR }}/config.yaml" | head -1)"
          [ -n "$VERSION" ] || { echo "::error::无法从 config.yaml 读取 version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read BUILD_FROM for ${{ matrix.arch }} from build.json
        id: build_from
        run: |
          BF="$(jq -r --arg a "${{ matrix.arch }}" '.build_from[$a] // empty' "${{ env.ADDON_DIR }}/build.json")"
          [ -n "$BF" ] || { echo "::error::build.json 缺 build_from.${{ matrix.arch }}"; exit 1; }
          echo "build_from=$BF" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        run: |
          TAGS="${{ env.IMAGE_NAMESPACE }}/haos-mirror-switcher-${{ matrix.arch }}:${{ steps.version.outputs.version }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,${{ env.IMAGE_NAMESPACE }}/haos-mirror-switcher-${{ matrix.arch }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.ADDON_DIR }}
          file: ./${{ env.ADDON_DIR }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ steps.build_from.outputs.build_from }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
