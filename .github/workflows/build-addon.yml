name: Build & push local add-on prebuilt images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "haos-mirror-switcher/**"
      - "hacs-cn-install/**"
      - ".github/workflows/build-addon.yml"
    tags:
      - "haos-mirror-switcher-*"
      - "hacs-cn-install-*"

concurrency:
  group: build-addon-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: treasoni

jobs:
  build:
    name: Build ${{ matrix.slug }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: haos-mirror-switcher
            addon_dir: haos-mirror-switcher
            arch: amd64
            platform: linux/amd64
          - slug: haos-mirror-switcher
            addon_dir: haos-mirror-switcher
            arch: aarch64
            platform: linux/aarch64
          - slug: hacs-cn-install
            addon_dir: hacs-cn-install
            arch: amd64
            platform: linux/amd64
          - slug: hacs-cn-install
            addon_dir: hacs-cn-install
            arch: aarch64
            platform: linux/aarch64

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version from config.yaml
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n -E 's/^version:[[:space:]]*"?([^" ]*)"?[[:space:]]*$/\1/p' "${{ matrix.addon_dir }}/config.yaml" | head -1)"
          [ -n "$VERSION" ] || { echo "::error::无法从 config.yaml 读取 version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read BUILD_FROM for ${{ matrix.arch }} from build.json
        id: build_from
        shell: bash
        run: |
          BF="$(jq -r --arg a "${{ matrix.arch }}" '.build_from[$a] // empty' "${{ matrix.addon_dir }}/build.json")"
          [ -n "$BF" ] || { echo "::error::build.json 缺 build_from.${{ matrix.arch }}"; exit 1; }
          echo "build_from=$BF" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.slug }}-${{ matrix.arch }}"
          TAGS="$IMAGE:${{ steps.version.outputs.version }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.addon_dir }}
          file: ./${{ matrix.addon_dir }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ steps.build_from.outputs.build_from }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
