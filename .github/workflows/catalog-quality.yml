name: Catalog quality

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: bash tests/test_docker_policy.sh
      - run: python .claude/scripts/catalog_health.py --check
      - run: bash .claude/scripts/check-docker.sh --all --baseline .claude/baselines/docker-policy.txt
