apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: prompt-cache-optimizer
  version: 0.1.0
  description: "Audit and optimize LLM prompt-cache hit rate, input tokens, latency, and call cost."
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: read
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
