apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: grill-with-docs
  version: 0.1.0
  description: "A relentless interview to sharpen a plan or design, which also creates docs (ADR's and glossary) as we go."
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: read
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
