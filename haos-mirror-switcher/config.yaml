# === 上游资料卡 ===
# 本项目为自有开发工具（source: local），无独立上游软件仓库，方案对齐社区教程「HAOS 国内换源」。
# prebuilt: true   # 预构建模式：镜像由 CI 构建推送 ghcr.io，Supervisor 从国内入口拉取、不本地构建
# upstream: https://gitee.com/zhqznc_10603234_123/ha-addon
# 安全边界：本版本只做真实 manifest 检查，不写入 Supervisor 的非官方镜像映射；
#           旧版映射只能由用户明确点击“清除旧配置并恢复直连”来清理。
#           D-Bus 调 RAUC Installer.Install + 重启（官方原版无 OTA URL 配置入口）
# ports: 无对外端口，仅 ingress Web 界面
# default_credentials: 无（ingress 由 Supervisor 登录鉴权）
# data_dir: /data（addon_config，持久化状态与备份；宿主 /mnt/data/supervisor/addons_config/ 下以 slug 命名的子目录）
# env_vars: SUPERVISOR_TOKEN（hassio_api 注入）
# version: 0.2.4
name: HAOS 国内换源
version: "0.2.4"
slug: haos-mirror-switcher
description: 只读检查国内镜像入口，并清理旧版本留下的非官方镜像映射。
url: https://gitee.com/zhqznc_10603234_123/ha-addon
arch:
  - aarch64
  - amd64
image: ghcr.nju.edu.cn/treasoni/haos-mirror-switcher-{arch}
startup: application
boot: auto
init: false
docker_api: true
hassio_api: true
hassio_role: admin
host_dbus: true
ingress: true
ingress_port: 8569
map:
  - addon_config:rw
options:
  auto_switch: true
  probe_interval_hours: 6
  enable_ghcr: true
  enable_dockerio: true
  enable_lscr: true
  probe_timeout_seconds: 8
  enable_ota: false
schema:
  auto_switch: bool
  probe_interval_hours: int
  enable_ghcr: bool
  enable_dockerio: bool
  enable_lscr: bool
  probe_timeout_seconds: int
  enable_ota: bool
