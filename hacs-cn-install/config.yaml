# === 上游资料卡 ===
# prebuilt: true   # 预构建镜像从国内入口拉取，避免首次安装前的双通道本地构建
# upstream: https://gitee.com/hacs-china/integration   # HACS 极速版第三方 fork
# ports: 无对外端口（startup: once 一次性安装器，无 ingress）
# default_credentials: 无
# data_dir: 无持久化（写入 homeassistant_config:rw 映射的 /homeassistant/custom_components/hacs）
# env_vars: 无（安装器运行时联网端点：gitee.com + pypi.tuna.tsinghua.edu.cn）
# version: 2.0.5.3   # 固定验证版本：tag=2.0.5.3，commit=d1c828dd078736ec663951844786cf8285e18b4d
# frontend: 20250128065759   # 清华 TUNA 对应前端 wheel
# dependency: aiogithubapi==24.6.0   # 清华 TUNA，预置到 Home Assistant deps 目录
name: HACS 极速版国内安装器
version: "0.3.0"
slug: hacs-cn-install
description: 从 Gitee 和清华 TUNA 安装固定版本的 HACS 极速版，面向国内网络并自动预置依赖。
url: https://gitee.com/hacs-china/integration
arch:
  - aarch64
  - amd64
startup: once
boot: manual
init: false
image: ghcr.nju.edu.cn/treasoni/hacs-cn-install-{arch}
map:
  - homeassistant_config:rw
options:
  replace_existing: false
schema:
  replace_existing: bool
