apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: writing-for-agents
  version: 0.1.0
  description: "Writing documents for agents. Use when creating or editing skills, or modifying AGENTS.md or CLAUDE.md."
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
