apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: teach
  version: 0.1.0
  description: "Teach the user a new skill or concept, within this workspace."
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: read
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
