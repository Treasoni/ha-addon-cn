apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: sync-skill-registry
  version: 0.1.0
  description: "Scan */SKILL.md and update skill-invocation.md tables."
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: read
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
