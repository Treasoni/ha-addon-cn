apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: maintain-learnings
  version: 0.1.0
  description: "Maintain the .learnings experience library: cluster, diagnose, fix the source, then archive resolved records."
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: read
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
