apiVersion: agent-platform/v1
kind: Skill
metadata:
  name: resolving-merge-conflicts
  version: 0.1.0
  description: "Use when you need to resolve an in-progress git merge/rebase conflict."
spec:
  entrypoint: SKILL.md
  capabilities:
    - skill.execute
  permissions:
    filesystem: write
    network: none
    subprocess: allow
    git: write
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
