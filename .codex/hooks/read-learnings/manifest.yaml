apiVersion: agent-platform/v1
kind: Hook
metadata:
  name: read-learnings
  version: 0.1.0
  description: "Load the .learnings experience library at session start."
spec:
  entrypoint: ../read_learnings.py
  event: SessionStart
  capabilities:
    - hook.execute
  permissions:
    filesystem: read
    network: none
    subprocess: none
    git: none
  dependsOn: []
  lifecycle:
    discoverable: true
    deprecated: false
